services:
  - type: web
    name: vendorflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: VENDORFLOW_DEMO_PASSWORD
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://vendorflow-operations.alexaugustokastro.chatgpt.site,https://vendorflow-web.onrender.com
